<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | GameStore Admin</title>
    <meta name="description" content="Consulta y edita tu perfil de administrador en GameStore Admin.">
    <link rel="icon" type="image/svg+xml" href="../img/logo/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('gamestore_theme')||'dark'}catch(e){}</script>
</head>
<body data-page="perfil" data-title="Mi perfil" data-root="../">
<div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="app-main">
        <div id="navbar-slot"></div>
        <main class="app-content" id="main-content">
            <header class="page-header"><div><h1>Mi perfil</h1><p>Información de tu cuenta de administrador.</p></div></header>
            <div class="row g-3">
                <div class="col-lg-4">
                    <article class="gs-card h-100"><div class="gs-card-body text-center">
                        <span class="avatar avatar-lg mb-3" id="pAvatar" aria-hidden="true"></span>
                        <h2 class="h4 mb-1" id="pName"></h2><p class="text-muted mb-3" id="pRole"></p>
                        <dl class="detail-list text-start" style="grid-template-columns:1fr">
                            <div><dt>Email</dt><dd id="pEmail"></dd></div><div><dt>Teléfono</dt><dd id="pPhone"></dd></div>
                            <div><dt>Rol</dt><dd id="pRol2"></dd></div><div><dt>Fecha de registro</dt><dd id="pSince"></dd></div>
                        </dl></div></article>
                </div>
                <div class="col-lg-8">
                    <section class="gs-card" aria-labelledby="h-edit">
                        <div class="gs-card-header"><h2 id="h-edit">Editar perfil</h2></div>
                        <form class="gs-card-body" id="profileForm" novalidate>
                            <div class="row g-3">
                                <div class="col-12"><label class="form-label" for="u-nombre">Nombre completo</label><input class="form-control" id="u-nombre" name="nombre"><div class="invalid-feedback"></div></div>
                                <div class="col-md-6"><label class="form-label" for="u-email">Email</label><input class="form-control" type="email" id="u-email" name="email"><div class="invalid-feedback"></div></div>
                                <div class="col-md-6"><label class="form-label" for="u-telefono">Teléfono</label><input class="form-control" id="u-telefono" name="telefono"><div class="invalid-feedback"></div></div>
                                <div class="col-md-6"><label class="form-label" for="u-rol">Rol</label><input class="form-control" id="u-rol" name="rol" readonly></div>
                                <div class="col-md-6"><label class="form-label" for="u-registro">Fecha de registro</label><input class="form-control" id="u-registro" name="registro" readonly></div>
                            </div>
                            <div class="text-end mt-3"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar cambios</button></div>
                        </form>
                    </section>
                </div>
            </div>
        </main>
        <div id="footer-slot"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/settings.js"></script>
<script>GS.ready(Settings.initProfile);</script>
</body>
</html>
