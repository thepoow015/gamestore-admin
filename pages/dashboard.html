<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | GameStore Admin</title>
    <meta name="description" content="Resumen general de ventas, pedidos, clientes e inventario de GameStore.">
    <link rel="icon" type="image/svg+xml" href="../img/logo/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('gamestore_theme')||'dark'}catch(e){}</script>
</head>
<body data-page="dashboard" data-title="Dashboard" data-root="../">
<div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="app-main">
        <div id="navbar-slot"></div>
        <main class="app-content" id="main-content">
            <header class="page-header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Resumen general de GameStore · <span id="todayLabel"></span></p>
                </div>
                <div class="page-actions">
                    <label class="visually-hidden" for="periodSelect">Periodo</label>
                    <select class="form-select w-auto" id="periodSelect">
                        <option value="7">Últimos 7 días</option>
                        <option value="30" selected>Últimos 30 días</option>
                        <option value="90">Últimos 90 días</option>
                    </select>
                    <button class="btn btn-primary" type="button" id="btnExport"><i class="bi bi-download me-1"></i>Exportar</button>
                </div>
            </header>

            <section class="row g-3 mb-4" aria-label="Indicadores principales" id="kpiRow"></section>

            <section class="row g-3 mb-4">
                <div class="col-xl-8">
                    <article class="gs-card h-100">
                        <div class="gs-card-header">
                            <div><h2>Ventas</h2><small class="text-muted" id="salesSubtitle"></small></div>
                            <div><label class="visually-hidden" for="salesRange">Rango del gráfico</label>
                                <select class="form-select form-select-sm" id="salesRange">
                                    <option value="7d">7 días</option>
                                    <option value="30d">30 días</option>
                                    <option value="6m">6 meses</option>
                                    <option value="7m" selected>7 meses</option>
                                    <option value="1y">1 año</option>
                                </select></div>
                        </div>
                        <div class="gs-card-body"><div class="chart-box"><canvas id="salesChart" aria-label="Gráfico de ventas" role="img"></canvas></div></div>
                    </article>
                </div>
                <div class="col-xl-4">
                    <article class="gs-card h-100">
                        <div class="gs-card-header"><h2>Ventas por categoría</h2></div>
                        <div class="gs-card-body"><div class="chart-box"><canvas id="categoryChart" aria-label="Ventas por categoría" role="img"></canvas></div></div>
                    </article>
                </div>
            </section>

            <section class="row g-3 mb-4">
                <div class="col-xl-8">
                    <article class="gs-card h-100">
                        <div class="gs-card-header"><h2>Pedidos recientes</h2><a class="btn btn-sm btn-outline-secondary" href="pedidos.html">Ver todos</a></div>
                        <div class="table-responsive">
                            <table class="table gs-table table-hover align-middle mb-0">
                                <thead><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th class="num">Total</th><th>Pago</th><th>Estado</th><th class="text-end">Acción</th></tr></thead>
                                <tbody id="recentOrders"></tbody>
                            </table>
                        </div>
                    </article>
                </div>
                <div class="col-xl-4 d-flex flex-column gap-3">
                    <article class="gs-card">
                        <div class="gs-card-header"><h2>Productos más vendidos</h2></div>
                        <div id="topProducts"></div>
                    </article>
                    <article class="gs-card">
                        <div class="gs-card-header"><h2><i class="bi bi-exclamation-triangle text-warning me-1"></i>Alertas de inventario</h2></div>
                        <div id="stockAlerts"></div>
                        <div class="gs-card-footer"><a class="btn btn-outline-primary btn-sm w-100" href="inventario.html">Ver inventario</a></div>
                    </article>
                </div>
            </section>
        </main>
        <div id="footer-slot"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/products.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
