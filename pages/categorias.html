<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorías | GameStore Admin</title>
    <meta name="description" content="Gestiona las categorías de videojuegos de GameStore.">
    <link rel="icon" type="image/svg+xml" href="../img/logo/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('gamestore_theme')||'dark'}catch(e){}</script>
</head>
<body data-page="categorias" data-title="Categorías" data-root="../">
<div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="app-main">
        <div id="navbar-slot"></div>
        <main class="app-content" id="main-content">
            <header class="page-header">
                <div><h1>Categorías</h1><p>Organiza el catálogo por géneros de videojuegos.</p></div>
                <div class="page-actions"><button class="btn btn-primary" type="button" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Nueva categoría</button></div>
            </header>
            <section class="gs-card" aria-label="Listado de categorías">
                <div id="listState"></div>
                <div class="table-responsive" id="tableWrap">
                    <table class="table gs-table table-hover align-middle mb-0">
                        <thead><tr><th scope="col">Categoría</th><th scope="col">Descripción</th><th scope="col" class="num">Productos</th><th scope="col">Estado</th><th scope="col" class="text-end">Acciones</th></tr></thead>
                        <tbody id="categoriesBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
        <div id="footer-slot"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/categories.js"></script>
<script>GS.ready(Categories.init);</script>
</body>
</html>
