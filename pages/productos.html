<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos | GameStore Admin</title>
    <meta name="description" content="Administra el catálogo de videojuegos de GameStore.">
    <link rel="icon" type="image/svg+xml" href="../img/logo/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('gamestore_theme')||'dark'}catch(e){}</script>
</head>
<body data-page="productos" data-title="Productos" data-root="../">
<div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="app-main">
        <div id="navbar-slot"></div>
        <main class="app-content" id="main-content">
            <header class="page-header">
                <div><h1>Productos</h1><p>Administra el catálogo de videojuegos.</p></div>
                <div class="page-actions"><button class="btn btn-primary" type="button" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Agregar producto</button></div>
            </header>

            <section class="gs-card mb-3" aria-label="Filtros">
                <form class="gs-card-body" id="filtersForm">
                    <div class="row g-2 align-items-end">
                        <div class="col-lg-3 col-md-6"><label class="form-label" for="fQ">Buscar</label><input class="form-control" type="search" id="fQ" name="q" placeholder="Buscar producto…"></div>
                        <div class="col-lg-2 col-md-6"><label class="form-label" for="fCat">Categoría</label><select class="form-select" id="fCat" name="cat"><option value="">Todas</option></select></div>
                        <div class="col-lg-2 col-md-6"><label class="form-label" for="fPlat">Plataforma</label><select class="form-select" id="fPlat" name="plat"><option value="">Todas</option></select></div>
                        <div class="col-lg-2 col-md-6"><label class="form-label" for="fEstado">Estado</label><select class="form-select" id="fEstado" name="estado"><option value="">Todos</option></select></div>
                        <div class="col-lg-3 col-md-6"><label class="form-label" for="fSort">Ordenar por</label>
                            <select class="form-select" id="fSort" name="sort">
                                <option value="creado:desc">Más recientes</option><option value="creado:asc">Más antiguos</option>
                                <option value="nombre:asc">Nombre (A-Z)</option><option value="nombre:desc">Nombre (Z-A)</option>
                                <option value="precio:asc">Precio: menor a mayor</option><option value="precio:desc">Precio: mayor a menor</option>
                                <option value="stock:asc">Stock: menor a mayor</option><option value="stock:desc">Stock: mayor a menor</option>
                            </select></div>
                        <div class="col-12 d-flex gap-2 justify-content-end">
                            <button class="btn btn-outline-secondary" type="button" id="btnClear"><i class="bi bi-x-circle me-1"></i>Limpiar</button>
                            <button class="btn btn-primary" type="submit"><i class="bi bi-funnel me-1"></i>Filtrar</button>
                        </div>
                    </div>
                </form>
            </section>

            <div class="bulk-bar d-none" id="bulkBar" role="region" aria-label="Acciones masivas">
                <span class="count" id="bulkCount"></span>
                <button class="btn btn-sm btn-outline-success" type="button" data-bulk="activate"><i class="bi bi-toggle-on me-1"></i>Activar</button>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-bulk="deactivate"><i class="bi bi-toggle-off me-1"></i>Desactivar</button>
                <button class="btn btn-sm btn-danger" type="button" data-bulk="delete"><i class="bi bi-trash me-1"></i>Eliminar</button>
            </div>

            <section class="gs-card" aria-label="Listado de productos">
                <div id="listState" aria-live="polite"></div>
                <div class="table-responsive d-none" id="tableWrap">
                    <table class="table gs-table table-hover align-middle mb-0" id="productsTable">
                        <thead><tr>
                            <th scope="col"><input class="form-check-input" type="checkbox" id="checkAll" aria-label="Seleccionar todos"></th>
                            <th scope="col">Imagen</th><th scope="col">Producto</th><th scope="col">Categoría</th><th scope="col">Plataforma</th>
                            <th scope="col" class="num">Precio</th><th scope="col" class="num">Stock</th><th scope="col">Estado</th><th scope="col">Fecha</th><th scope="col" class="text-end">Acciones</th>
                        </tr></thead>
                        <tbody id="productsBody"></tbody>
                    </table>
                </div>
                <div class="gs-card-footer" id="pager"></div>
            </section>
        </main>
        <div id="footer-slot"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/products.js"></script>
<script>GS.ready(Products.initList);</script>
</body>
</html>
