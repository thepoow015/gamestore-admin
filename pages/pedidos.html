<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos | GameStore Admin</title>
    <meta name="description" content="Gestiona los pedidos de GameStore.">
    <link rel="icon" type="image/svg+xml" href="../img/logo/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('gamestore_theme')||'dark'}catch(e){}</script>
</head>
<body data-page="pedidos" data-title="Pedidos" data-root="../">
<div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="app-main">
        <div id="navbar-slot"></div>
        <main class="app-content" id="main-content">
            <header class="page-header">
                <div><h1>Pedidos</h1><p>Sigue el estado de las compras de tus clientes.</p></div>
                <div class="page-actions"><button class="btn btn-primary" type="button" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Nuevo pedido</button></div>
            </header>

            <section class="gs-card mb-3" aria-label="Filtros">
                <form class="gs-card-body" id="filtersForm">
                    <div class="row g-2 align-items-end">
                        <div class="col-lg-3 col-md-6"><label class="form-label" for="fQ">Buscar</label><input class="form-control" type="search" id="fQ" name="q" placeholder="ID, cliente o producto…"></div>
                        <div class="col-lg-2 col-md-6"><label class="form-label" for="fEstado">Estado</label>
                            <select class="form-select" id="fEstado" name="estado"><option value="">Todos</option><option>Completado</option><option>Procesando</option><option>Pendiente</option><option>Enviado</option><option>Cancelado</option></select></div>
                        <div class="col-lg-2 col-md-6"><label class="form-label" for="fPeriodo">Fecha</label>
                            <select class="form-select" id="fPeriodo" name="periodo"><option value="">Todas</option><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option></select></div>
                        <div class="col-lg-2 col-md-6"><label class="form-label" for="fPago">Método de pago</label>
                            <select class="form-select" id="fPago" name="pago"><option value="">Todos</option><option>Tarjeta</option><option>Transferencia</option><option>PayPal</option><option>Efectivo</option></select></div>
                        <div class="col-lg-3 d-flex gap-2">
                            <button class="btn btn-primary flex-fill" type="submit"><i class="bi bi-funnel me-1"></i>Filtrar</button>
                            <button class="btn btn-outline-secondary flex-fill" type="button" id="btnClear">Limpiar</button>
                        </div>
                    </div>
                </form>
            </section>

            <section class="gs-card" aria-label="Listado de pedidos">
                <div id="listState"></div>
                <div class="table-responsive" id="tableWrap">
                    <table class="table gs-table table-hover align-middle mb-0">
                        <thead><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Productos</th><th class="num">Total</th><th>Pago</th><th>Estado</th><th class="text-end">Acción</th></tr></thead>
                        <tbody id="ordersBody"></tbody>
                    </table>
                </div>
                <div class="gs-card-footer" id="pager"></div>
            </section>
        </main>
        <div id="footer-slot"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/products.js"></script>
<script src="../js/orders.js"></script>
<script>GS.ready(Orders.initList);</script>
</body>
</html>
